name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # GitHub sometimes takes a few seconds to list an upload it has
      # just accepted. Without this pause the deploy step often asks too
      # soon, finds nothing and fails. Measured 24 November 2026.
      - name: Wait for the upload to be listed
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v5
